name: CI - Interface

# On pushes to main this is invoked by deploy-testing.yaml via workflow_call, so that
# the deploy is gated on it rather than racing it.
on:
  pull_request:
    branches:
      - main
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Format, lint, types and build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # The build only has to compile here, not run, so placeholders are enough for the
      # three variables config.ts requires at module load. Real values are injected by
      # deploy_reusable.yaml from the target environment.
      REACT_APP_ENV_NAME: testing
      REACT_APP_INFURA_KEY: ci-placeholder
      REACT_APP_WIDGETS_URL: https://example.invalid
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
          cache-dependency-path: "./pnpm-lock.yaml"

      - run: pnpm install --frozen-lockfile

      # Non-mutating checks run first, so they actually gate: `pnpm prettier` and
      # `pnpm lint` rewrite files, which would make them pass unconditionally and
      # would leave the build compiling something other than the committed code.
      - run: pnpm prettier:check
      - run: pnpm lint:check
      - run: pnpm tsc
      - run: pnpm build
