name: Deploy PR preview

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  deploy:
    # Fork PRs cannot read environment secrets, so the build would fail on the
    # required-variable check. Skip them rather than fail them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/deploy_reusable.yaml
    with:
      environment: testing
      # One deployment serving both halves at #/dapp/... and #/dr_center/...
      view_modes: '["dapp,dr_center"]'
      # Anything other than the project's production branch makes this a Preview
      # deployment, published at https://pr-<n>.<project>.pages.dev.
      cf_branch: pr-${{ github.event.number }}
      is_preview: true
    secrets: inherit

  comment:
    needs: deploy
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write
    steps:
      - name: Comment preview URL
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: cf-preview
          message: |
            ### Preview deployment

            | View | URL |
            | ---- | --- |
            | dApp | ${{ needs.deploy.outputs.deployment_url }}/#/dapp |
            | DR Center | ${{ needs.deploy.outputs.deployment_url }}/#/dr_center |

            Built from ${{ github.event.pull_request.head.sha }}.
